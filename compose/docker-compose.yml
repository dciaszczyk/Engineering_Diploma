x-common: &common
  build:
    context: ..
    dockerfile: compose/Dockerfile
  image: onion-proto:latest
  restart: unless-stopped

services:
  relay1:
    <<: *common
    command: python serwer.py
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"

  relay2:
    <<: *common
    command: python serwer.py
    environment:
      PORT: "8002"
    ports:
      - "8002:8002"

  relay3:
    <<: *common
    command: python serwer.py
    environment:
      PORT: "8003"
    ports:
      - "8003:8003"

  final:
    <<: *common
    command: python final_dest.py
    environment:
      PORT: "9000"
    ports:
      - "9000:9000"