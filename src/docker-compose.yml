services:
  # PostgreSQL + PostGIS
  postgres:
    image: postgis/postgis:16-3.5
    container_name: medapp-baza
    environment:
      POSTGRES_DB: medapp
      POSTGRES_USER: medapp_user
      POSTGRES_PASSWORD: medapp_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medapp_user -d medapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medapp-network

  # Cache
  redis:
    image: redis:7.2-alpine
    container_name: medapp-redis
    command: redis-server --requirepass medapp_redis_pass --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medapp_redis_pass", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medapp-network

  # Przechowywanie dokumentów
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: medapp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medapp_minio
      MINIO_ROOT_PASSWORD: medapp_minio_pass
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Konsola webowa
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medapp-network

  # Aplikacja Spring Boot (backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medapp-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Baza danych
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medapp
      SPRING_DATASOURCE_USERNAME: medapp_user
      SPRING_DATASOURCE_PASSWORD: medapp_pass
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: medapp_redis_pass
      # MinIO
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: medapp_minio
      MINIO_SECRET_KEY: medapp_minio_pass
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - medapp-network

# Wolumeny
volumes:
  postgres_data:
  redis_data:
  minio_data:

# Sieć wewnętrzna
networks:
  medapp-network:
    driver: bridge